<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>OPI Memory Tool: Worked Example</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: sticky progress bar; tabs; a two-level picker (item, then stage 1-7) over one working panel per stage. */
:root {
  --paper: #EEF1F5;
  --card: #FFFFFF;
  --ink: #17202B;
  --muted: #5A6676;
  --line: #D6DCE4;
  --accent: #1F4FD1;
  --accent-soft: #E3E9FB;
  --good: #1D7A4D;
  --good-soft: #DDF1E6;
  --again: #B04E27;
  --again-soft: #F8E4DA;
  --font-ru: "Literata", "PT Serif", Georgia, serif;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F141A; --card: #18202A; --ink: #E5EAF0; --muted: #93A0AF; --line: #2A3541;
    --accent: #84A0FF; --accent-soft: #1D2A4D; --good: #55C78F; --good-soft: #15342A;
    --again: #E8906A; --again-soft: #3A2219; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F141A; --card: #18202A; --ink: #E5EAF0; --muted: #93A0AF; --line: #2A3541;
  --accent: #84A0FF; --accent-soft: #1D2A4D; --good: #55C78F; --good-soft: #15342A;
  --again: #E8906A; --again-soft: #3A2219; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 860px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 8px; }
.topline { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-ru); font-weight: 600; font-size: 1.15rem; margin: 0; }
.pct { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.pct b { color: var(--ink); font-weight: 500; }
.bigbar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bigbar > i { display: block; height: 100%; background: var(--good); width: 0; transition: width .3s; }
.tabs { display: flex; gap: 4px; overflow-x: auto; }
.tab { flex: 0 0 auto; border: 0; background: transparent; color: var(--muted); font: 500 0.88rem var(--font-ui); padding: 6px 10px; border-radius: 6px; cursor: pointer; }
.tab[aria-pressed="true"] { background: var(--ink); color: var(--card); }
.wrap { max-width: 860px; margin: 0 auto; padding-block: 20px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
h2 { font-family: var(--font-ru); font-weight: 600; font-size: 1.35rem; margin: 0; text-wrap: balance; }
h3 { font-family: var(--font-ui); font-weight: 600; font-size: 1rem; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.label { font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.lede { max-width: 65ch; color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.chip { flex: 0 0 auto; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 500 0.85rem var(--font-ui); padding: 6px 11px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip .num { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--card); }
.chip[aria-pressed="true"] .num { color: var(--card); opacity: .8; }
.stepper { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 4px; }
.sbtn { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 8px 6px; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; min-width: 0; }
.sbtn .sn { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); }
.sbtn .st { font-size: 0.8rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.sbtn.done { background: var(--good-soft); border-color: var(--good); }
.sbtn.done .sn { color: var(--good); }
.sbtn.now { border-color: var(--accent); }
.sbtn[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
@media (max-width: 560px) { .sbtn .st { display: none; } .sbtn { align-items: center; } }
.goal { font-family: var(--font-ru); font-size: 1.1rem; max-width: 65ch; }
.why { font-size: 0.88rem; color: var(--muted); max-width: 65ch; }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; max-width: 70ch; }
.exit { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; background: var(--paper); }
.exit.ok { border-color: var(--good); }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.check input { margin-top: 4px; width: 16px; height: 16px; accent-color: var(--good); flex: 0 0 auto; }
.auto { display: flex; gap: 8px; align-items: center; font-size: 0.9rem; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); flex: 0 0 auto; }
.dot.on { background: var(--good); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { font: 500 0.9rem var(--font-ui); border-radius: 8px; padding: 9px 16px; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink); display: inline-flex; align-items: center; gap: 8px; }
.btn kbd { font-family: var(--font-mono); font-size: 0.7rem; color: inherit; opacity: .65; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--card); }
.btn.good { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.btn.again { background: var(--again-soft); border-color: var(--again); color: var(--again); }
.btn.small { padding: 6px 11px; font-size: 0.82rem; }
.btn:disabled { opacity: .45; cursor: default; }
.linkish { background: none; border: 0; color: var(--muted); font: inherit; text-decoration: underline; cursor: pointer; padding: 0; }
.ru { font-family: var(--font-ru); font-size: 1.1rem; line-height: 1.65; max-width: 65ch; }
.ru.sm { font-size: 0.98rem; }
.ru.letters { letter-spacing: .06em; word-spacing: .25em; }
.map { display: flex; flex-direction: column; }
.maprow { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 6px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.maprow:last-child { border-bottom: 0; }
.maprow .n { font-family: var(--font-mono); font-size: .78rem; color: var(--muted); padding-top: 3px; }
.mapin { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin-top: 6px; }
@media (max-width: 560px) { .mapin { grid-template-columns: minmax(0, 1fr); } }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field span { font-size: .75rem; color: var(--muted); }
input[type="text"], textarea { width: 100%; font: .92rem var(--font-ui); padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); color: var(--ink); }
textarea { min-height: 110px; font: 1.02rem/1.6 var(--font-ru); resize: vertical; }
.block { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.block .ru + .ru { padding-top: 8px; border-top: 1px dashed var(--line); }
.cue-c { font-weight: 600; font-size: .85rem; color: var(--muted); }
.beatcard { display: flex; flex-direction: column; gap: 6px; counter-reset: b; margin: 0; padding: 0; list-style: none; }
.beatcard li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.beatcard li:last-child { border-bottom: 0; }
.beatcard .n { font-family: var(--font-mono); font-size: .78rem; color: var(--muted); padding-top: 2px; }
.beatcard .k { font-family: var(--font-ru); color: var(--accent); font-size: .92rem; }
.hiddencard { border: 1px dashed var(--line); border-radius: 10px; padding: 26px; text-align: center; color: var(--muted); }
.log { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font-family: var(--font-mono); font-size: .72rem; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.pill.ok { border-color: var(--good); color: var(--good); background: var(--good-soft); }
.pill.bad { border-color: var(--again); color: var(--again); background: var(--again-soft); }
.drills { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 620px) { .drills { grid-template-columns: minmax(0, 1fr); } }
.drill { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.drill.done { border-color: var(--good); }
.roll { font-family: var(--font-ru); font-size: 1rem; background: var(--accent-soft); color: var(--ink); border-radius: 7px; padding: 8px 10px; }
/* drill widget */
.modes { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--card); width: fit-content; max-width: 100%; }
.modes button { border: 0; background: transparent; color: var(--ink); font: 500 .85rem var(--font-ui); padding: 7px 12px; cursor: pointer; border-right: 1px solid var(--line); }
.modes button:last-child { border-right: 0; }
.modes button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
.path { display: flex; flex-wrap: wrap; gap: 6px; }
.step { min-width: 32px; height: 28px; padding: 0 7px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 500 .76rem var(--font-mono); cursor: pointer; }
.step.got { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.step.again { background: var(--again-soft); border-color: var(--again); color: var(--again); }
.step.current { outline: 2px solid var(--accent); outline-offset: 1px; }
.dcard { border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 12px; background: var(--paper); }
.dcue { font-weight: 600; font-size: 1.1rem; }
.context { font-family: var(--font-ru); color: var(--muted); font-size: .95rem; }
.veil { border: 1px dashed var(--line); border-radius: 8px; padding: 16px; color: var(--muted); font-size: .9rem; text-align: center; }
.diff { font-family: var(--font-ru); font-size: 1.08rem; line-height: 1.75; }
.diff .miss { background: var(--again-soft); color: var(--again); border-radius: 3px; padding: 0 2px; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--muted); cursor: pointer; }
.nav { display: flex; justify-content: space-between; gap: 8px; }
/* overview */
.items { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 620px) { .items { grid-template-columns: minmax(0, 1fr); } }
.itemcard { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; text-align: left; color: var(--ink); font: inherit; }
.itemcard:hover { border-color: var(--accent); }
.minis { display: flex; gap: 3px; }
.minis i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.minis i.on { background: var(--good); }
.minis i.now { background: var(--accent); }
.stagelist { display: flex; flex-direction: column; gap: 0; margin: 0; padding: 0; list-style: none; }
.stagelist li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.stagelist li:last-child { border-bottom: 0; }
.stagelist .n { font-family: var(--font-mono); color: var(--accent); }
.queue { display: flex; flex-direction: column; gap: 6px; }
.qrow { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.qrow:last-child { border-bottom: 0; }
/* mock */
.mockprompt { font-family: var(--font-ru); font-size: 1.2rem; line-height: 1.55; }
.interrupt { border: 2px solid var(--again); background: var(--again-soft); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.interrupt .ru { color: var(--ink); }
.clock { font-family: var(--font-mono); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.phr { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px 16px; }
@media (max-width: 560px) { .phr { grid-template-columns: minmax(0, 1fr); } }
.phr div { font-family: var(--font-ru); }
.phr small { display: block; font-family: var(--font-ui); color: var(--muted); font-size: .78rem; }
.tmap { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px 24px; }
@media (max-width: 620px) { .tmap { grid-template-columns: minmax(0, 1fr); } }
.tmrow { background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--ink); font: inherit; text-align: left; cursor: pointer; width: 100%; }
.tmrow:hover span:first-child { color: var(--accent); }
.dot.now { background: var(--accent); }
.edrow { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start; }
.edrow .n { font-family: var(--font-mono); font-size: .78rem; color: var(--muted); padding-top: 22px; }
.edfields { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.edfields textarea { min-height: 70px; font-size: .98rem; }
.edbtns { display: flex; flex-direction: column; gap: 4px; padding-top: 18px; }
.edbtns .btn { padding: 4px 9px; justify-content: center; }
@media (max-width: 480px) { .edrow { grid-template-columns: minmax(0, 1fr) auto; } .edrow .n { display: none; } }
summary { cursor: pointer; }
select { font: .85rem var(--font-ui); padding: 5px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--card); color: var(--ink); max-width: 100%; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .bigbar > i { transition: none; } }
</style>

<script>
const VERSION = 'example'; // generated from opi-tool.html
const P = [
 {n:'1', name:'Introduction', ilr:'ILR 1+ / 2', ru:'Представьтесь (расскажите о себе, вашей семье, ваших хобби, вашем образовании, чем вы занимались до службы и т. п.)', groups:[
  {g:'Script', c:[
   ['Hello + job','Здравствуйте! Меня зовут Алекс, мне двадцать восемь лет. Я уже четыре года работаю переводчиком русского языка в переводческом агентстве.'],
   ['Why Russian','Ещё в школе я мечтал изучать иностранный язык, а именно русский, потому что прочитал «Преступление и наказание» и захотел прочитать его в оригинале. Как говорится, «великий и могучий».'],
   ['University + Suvorov','В две тысячи шестнадцатом году я поступил в университет на отделение славистики. Учиться было нелегко, но, как говорил Суворов, «тяжело в учении – легко в бою».'],
   ['Degree + Kazan','В две тысячи двадцатом году я окончил университет и получил степень бакалавра, а потом целый год стажировался в Казани.'],
   ['Spokane','Я родился и вырос в Спокане. Это не очень большой город на востоке штата Вашингтон, недалеко от границы с Айдахо. Мои родители до сих пор там живут.'],
   ['Parents + sister','Мой отец двадцать лет проработал пожарным, а мама преподаёт математику в местной школе. У меня есть младшая сестра, которой двенадцать лет.'],
   ['Sister = Mom','Она вылитая мама: зелёные глаза, веснушки и рыжие волосы. А ещё она такая же упрямая, каким я был в её возрасте!'],
   ['Chess','Когда я приезжаю домой, мы с ней обязательно играем в шахматы, и, честно говоря, она уже иногда у меня выигрывает.'],
   ['Dad: same hobbies','С отцом у нас общие увлечения: мы оба любим рыбалку и походы в горы. Видимо, яблоко от яблони недалеко падает.'],
   ['Dad’s boat','У отца есть старая деревянная лодка, которую он построил сам ещё до моего рождения.'],
   ['Wife, apartment, dog','Я женат. Мы с женой живём в Денвере, в небольшой квартире, вместе с нашим лабрадором по кличке Бублик.'],
   ['Free time','В свободное время я играю на гитаре и пеку хлеб на закваске, а ещё веду блог о русской литературе.']
  ]}]},
 {n:'2', name:'Past Narration', ilr:'ILR 2', ru:'Расскажите о наиболее запомнившейся вам поездке и объясните, почему именно это событие запомнилось вам больше других.', groups:[
  {g:'Script', c:[
   ['Yellowstone','Больше всего мне запомнилась поездка в Йеллоустонский национальный парк. Это огромный парк на северо-западе США, который знаменит своими гейзерами.'],
   ['Ten years ago','Мы с семьёй часто ходили в походы, но именно поездка десять лет назад запомнилась мне на всю жизнь. Как говорится, без приключений не обошлось.'],
   ['First night','В первый же вечер мы поставили палатку у озера, приготовили ужин на костре и легли спать.'],
   ['A noise','Посреди ночи меня разбудил странный шум: кто-то рылся в наших вещах прямо рядом с палаткой.'],
   ['The bear','Я выглянул наружу и увидел медведя, который пытался открыть наш холодильник с едой.'],
   ['Dad stays calm','Мой отец, человек очень спокойный, тихо сказал нам не двигаться, а сам начал громко хлопать в ладоши и разговаривать с медведем ровным голосом.'],
   ['The bear leaves','Минут через пять медведь, видимо, решил, что мы не стоим его внимания, и ушёл в лес.'],
   ['Great trip','Но всё хорошо, что хорошо кончается. Остаток поездки прошёл замечательно: мы видели гейзер «Старый служака», бизонов и даже волков.'],
   ['Why: how Dad acted','Эта поездка запомнилась мне больше других не из-за гейзеров, а из-за того, как повёл себя мой отец. Вместо того чтобы паниковать, он первым делом позаботился о нашей безопасности.'],
   ['The lesson','Именно тогда я понял, что в трудной ситуации главное – не терять голову. А ещё с тех пор мы всегда храним еду в машине!']

  if (kind === 'start') { const i = Math.floor(Math.random() * items.length); return 'Start at beat ' + (i + 1) + ': ' + beatOf(items[i]); }
  if (kind === 'follow') return rand(FOLLOW[id] || ['Почему?']);
  return rand(ROLLS[kind]);
}

function phraseRef() {
  const g = byN('★').groups.find(x => x.g === 'Bridges and recovery');
  return '<div class="phr">' + g.c.map(c => '<div>' + esc(c[1]) + '<small>' + esc(c[0]) + '</small></div>').join('') + '</div>';
}

function templateTool(id, s) {
  if (s === 0) { drillOwner = id; return drillHTML(id, {tag: 'frame', mode: 'letters', groups: true}); }
  if (s === 1) {
    const r = rolls[id + 'topic'], f = S.fills[id] || [];
    const gs = byN(id).groups;
    return gs.filter(g => !isSample(g.g)).map(g => '<div class="block"><span class="label">' + (gs.filter(x => !isSample(x.g)).length > 1 ? 'Frame: ' + esc(g.g) : 'The frame') + '</span><ol class="beatcard">' + g.c.map((c, i) => '<li><span class="n">' + (i + 1) + '</span><div>' + esc(c[0]) + '<div class="k">' + esc(c[1]) + '</div></div></li>').join('') + '</ol></div>').join('') +
      (gs.some(g => isSample(g.g)) ? gs.filter(g => isSample(g.g)).map(g => '<div class="block"><span class="label">Example: ' + esc(g.g.replace(/^Sample: /, '')) + '</span>' + g.c.map(c => '<p class="ru sm">' + esc(c[1]) + '</p>').join('') + '</div>').join('') : '') +
      (GRAMMAR[id] ? '<p class="muted">' + esc(GRAMMAR[id]) + '</p>' : '') +
      '<div class="row"><button type="button" class="btn" data-act="rollTopic">' + (r ? 'Roll another topic' : 'Roll a topic') + '</button></div>' +
      (r ? '<div class="roll">' + esc(r) + '</div><div class="row"><button type="button" class="btn good" data-act="logFill">I gave a full answer on this aloud</button></div>' : '') +
      (f.length ? '<div class="log">' + f.map(x => '<span class="pill ok">' + esc(x.topic) + '</span>').join('') + '</div>' : '');
  }
  if (s === 2) return '<div class="row"><button type="button" class="btn" data-goto="mock">Open the mock interview</button></div>';
  return '';
}

function itemPicker(list, sel, attr) {

    return '<button type="button" class="chip" ' + attr + '="' + id + '" aria-pressed="' + (id === sel) + '"><span class="num">' + p.n + '</span>' + esc(p.name) + '<span class="num">' + (cur >= n ? '✓' : (cur + 1) + '/' + n) + '</span></button>'; }).join('') + '</nav>';
}

// ---------- script editor ----------
let E = null, Eid = null, Eopen = false, EreplaceArmed = false, Epaste = '';
function draftFrom(id) {
  const p = byN(id), secs = [];
  p.items.forEach(it => { let sec = secs[secs.length - 1]; if (!sec || sec.g !== it.group) { sec = {g: it.group, c: []}; secs.push(sec); } sec.c.push({id: it.id, cue: it.cue, text: it.text}); });
  return secs.length ? secs : [{g: 'Script', c: [{id: newId(), cue: '', text: ''}]}];
}
function newId() { return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function splitScript(t) {
  const sent = t.replace(/\s+/g, ' ').trim().split(/(?<=[.!?…])\s+(?=[«"А-ЯЁA-Z–-])/u).filter(Boolean);
  const out = []; let cur = '';
  sent.forEach(x => { cur = cur ? cur + ' ' + x : x; if (cur.split(' ').length >= 16) { out.push(cur); cur = ''; } });
  if (cur) out.push(cur);
  return out.map(text => ({id: newId(), cue: text.split(' ').slice(0, 3).join(' ') + '…', text}));
}
function editorHTML(id) {
  const p = byN(id), n = p.items.length;
  const isCustom = !!S.custom[id];
  if (Eid !== id) { E = null; Eid = id; Eopen = VERSION === 'blank' && !n; EreplaceArmed = false; Epaste = ''; }
  if (!Eopen) {
    return '<div class="card"><div class="row" style="justify-content:space-between"><div><h3>Your script</h3><p class="muted">' + (n ? n + ' chunks' + (isCustom && VERSION !== 'blank' ? ', edited by you' : '') : 'Nothing written yet') + '</p></div>' +
      '<div class="row"><button type="button" class="btn small" data-act="edOpen">' + (n ? 'Edit script' : 'Write your script') + '</button>' +
      (isCustom && VERSION !== 'blank' ? '<button type="button" class="linkish" data-act="edRestore">Restore the original</button>' : '') + '</div></div></div>';
  }
  if (!E) E = draftFrom(id);
  let h = '<div class="card"><h3>Your script</h3><p class="muted">Split your answer into chunks of one or two sentences. Give each chunk a short English cue: a few words that remind you what comes next. The cue is all you’ll see when you practice recall.</p>';
  if (STARTERS[id]) h += '<div class="row"><button type="button" class="btn small" data-act="edStarter">' + (EreplaceArmed ? 'Tap again to replace what’s here' : 'Start from the template') + '</button><span class="muted" style="font-size:.85rem">Fills in a frame with blanks to write over.</span></div>';
  h += '<details class="block"' + (Epaste ? ' open' : '') + '><summary><span class="label">Paste a whole answer and split it into chunks</span></summary><textarea id="edPaste" lang="ru" placeholder="Вставьте весь текст сюда…" style="margin-top:8px">' + esc(Epaste) + '</textarea><div class="row" style="margin-top:8px"><button type="button" class="btn small" data-act="edSplit">Split into chunks</button><span class="muted" style="font-size:.85rem">Replaces the chunks below. Check the cues afterwards.</span></div></details>';
  E.forEach((sec, si) => {
    h += '<div class="block"><label class="field"><span>Section name</span><input type="text" id="ed-g-' + si + '" data-edg="' + si + '" value="' + esc(sec.g) + '"></label>';
    sec.c.forEach((c, ci) => {
      h += '<div class="edrow"><span class="n">' + (ci + 1) + '</span><div class="edfields"><label class="field"><span>Cue (English)</span><input type="text" id="ed-c-' + si + '-' + ci + '" data-edc="' + si + ':' + ci + '" value="' + esc(c.cue) + '" placeholder="e.g. Why I chose Russian"></label>' +
        '<label class="field"><span>Russian text</span><textarea id="ed-t-' + si + '-' + ci + '" data-edt="' + si + ':' + ci + '" lang="ru" rows="3">' + esc(c.text) + '</textarea></label></div>' +
        '<div class="edbtns"><button type="button" class="btn small" data-edmove="' + si + ':' + ci + ':-1" aria-label="Move up"' + (ci === 0 ? ' disabled' : '') + '>↑</button><button type="button" class="btn small" data-edmove="' + si + ':' + ci + ':1" aria-label="Move down"' + (ci === sec.c.length - 1 ? ' disabled' : '') + '>↓</button><button type="button" class="btn small" data-eddel="' + si + ':' + ci + '" aria-label="Delete chunk">✕</button></div></div>';
    });
    h += '<div class="row"><button type="button" class="btn small" data-edadd="' + si + '">+ Add chunk</button>' + (E.length > 1 ? '<button type="button" class="linkish" data-eddelsec="' + si + '">Remove this section</button>' : '') + '</div></div>';
  });
  h += '<div class="row"><button type="button" class="btn small" data-act="edAddSec">+ Add section</button></div>';
  h += '<div class="row"><button type="button" class="btn primary" data-act="edSave">Save script</button>' + (n ? '<button type="button" class="btn" data-act="edCancel">Cancel</button>' : '') + '<span class="muted" style="font-size:.85rem">Chunks you change lose their “Got it” mark so you relearn them.</span></div></div>';
  return h;
}
function editorSave(id) {
  const old = {}; byN(id).items.forEach(it => { old[it.id] = it.text; });
  const clean = E.map(sec => ({g: (sec.g || 'Script').trim(), c: sec.c.filter(c => c.text.trim()).map(c => ({id: c.id, cue: c.cue.trim(), text: c.text.trim()}))})).filter(sec => sec.c.length);
  clean.forEach(sec => sec.c.forEach(c => { if (old[c.id] !== c.text) delete S.marks[c.id]; if (!c.cue) c.cue = c.text.split(' ').slice(0, 3).join(' ') + '…'; }));
  S.custom[id] = clean; buildItems(); touch(id); save();
  E = null; Eopen = false;
}

// mock
let M = {prompt: null, start: 0, timer: null, tick: null, interrupt: null, auto: true, checks: [false, false, false]};
function newMock() {
  const n = rand([...SCRIPTS, ...TEMPLATES]); const p = byN(n);
  let line = p.ru;
  if (TOPICS[n] && Math.random() < .6) line = p.name + ': ' + rand(TOPICS[n]);
  clearTimeout(M.timer); clearInterval(M.tick);
  M.prompt = {n, line}; M.interrupt = null; M.start = Date.now(); M.checks = M.checks.map(() => false);
  if (M.auto) M.timer = setTimeout(() => { doInterrupt(); }, (25 + Math.random() * 35) * 1000);
  M.tick = setInterval(() => { const el = document.getElementById('clock'); if (el) el.textContent = fmt((Date.now() - M.start) / 1000); else clearInterval(M.tick); }, 500);
  render();
}
function doInterrupt() {
  if (!M.prompt) return;
  const pool = Math.random() < .7 ? (FOLLOW[M.prompt.n] || []) : Object.values(FOLLOW).flat();
  M.interrupt = rand(pool); clearTimeout(M.timer); if (S.ui.tab === 'mock') render();
}
const fmt = s => { s = Math.floor(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
function viewMock() {
  let h = '<div><span class="label">Stage 7 for everything</span><h2>Mock interview</h2><p class="lede">You get a random prompt. Answer out loud right away, no prep. With auto-interrupt on, a follow-up cuts in at a random moment, the way a tester would. Record yourself if you can.</p></div>';
  h += '<div class="card"><div class="row" style="justify-content:space-between"><button type="button" class="btn primary" data-act="newMock">' + (M.prompt ? 'Next prompt' : 'Start') + '</button>' +
    '<label class="toggle"><input type="checkbox" id="mAuto"' + (M.auto ? ' checked' : '') + '> Auto-interrupt</label></div>';
  if (M.prompt) {
    h += '<span class="label">Prompt ' + M.prompt.n + '</span><p class="mockprompt">' + esc(M.prompt.line) + '</p><div class="row"><span class="clock" id="clock">' + fmt((Date.now() - M.start) / 1000) + '</span><button type="button" class="btn small" data-act="interrupt">Interrupt me now</button></div>';
    if (M.interrupt) h += '<div class="interrupt"><span class="label" style="color:var(--again)">Interruption</span><p class="ru">' + esc(M.interrupt) + '</p><p class="muted" style="font-size:.85rem">Answer this fully. Come back to your answer only if it makes sense, with a bridge phrase.</p></div>';
    const labels = ['I handled every interruption without freezing', 'Nothing came out as a word-for-word recital', 'The content came out even when the wording changed'];
    h += '<div class="exit"><span class="label">After the answer</span>' + labels.map((l, k) => '<label class="check"><input type="checkbox" data-mcheck="' + k + '"' + (M.checks[k] ? ' checked' : '') + '><span>' + l + '</span></label>').join('') +

  h += '<div class="card"><h3>Mock log</h3><p class="muted">Ready when three rounds are clean: every box ticked.</p>' +

  return h;

// ---------- render ----------
function render() {
  const n = doneCount();
  document.getElementById('pct').innerHTML = '<b>' + Math.round(100 * n / TOTAL) + '%</b> · ' + n + ' of ' + TOTAL + ' steps';
  document.getElementById('bigbar').style.width = (100 * n / TOTAL) + '%';
  document.querySelectorAll('#tabs .tab').forEach(t => t.setAttribute('aria-pressed', t.dataset.tab === S.ui.tab));
  drillOwner = null;
  const v = {overview: viewOverview, scripts: viewScripts, templates: viewTemplates, vocab: viewVocab, phrases: viewPhrases, mock: viewMock}[S.ui.tab] || viewOverview;
  document.getElementById('app').innerHTML = v();
  const ta = document.getElementById('dAttempt'); if (ta) ta.focus({preventScroll: true});
}
function curItem() { return S.ui.tab === 'scripts' ? S.ui.script : S.ui.tab === 'templates' ? S.ui.tmpl : S.ui.tab === 'phrases' ? '★' : S.ui.tab === 'vocab' ? 'V' : null; }
function curStage() { const id = curItem(); if (!id) return null; return S.ui.stage[id] != null ? S.ui.stage[id] : Math.min(currentStage(id), stagesFor(id).length - 1); }

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.tab) { S.ui.tab = d.tab; save(); render(); window.scrollTo(0, 0); return; }
  if (d.script) { S.ui.script = d.script; save(); render(); return; }
  if (d.tmpl) { S.ui.tmpl = d.tmpl; save(); render(); return; }
  if (d.stage != null) { const id = curItem(); S.ui.stage[id] = +d.stage; showReviewDrill = false; save(); render(); return; }
  if (d.open) { S.ui.tab = d.open; if (d.id) { if (d.open === 'scripts') S.ui.script = d.id; if (d.open === 'templates') S.ui.tmpl = d.id; if (d.st) S.ui.stage[d.id] = +d.st; else delete S.ui.stage[d.id]; } save(); render(); window.scrollTo(0, 0); return; }
  if (d.goto) { S.ui.tab = d.goto; save(); render(); window.scrollTo(0, 0); return; }
  if (d.dmode) { D.mode = d.dmode; D.revealed = false; D.typed = null; render(); return; }
  if (d.dk != null) { D.idx = +d.dk; D.revealed = false; D.typed = null; render(); return; }
  if (d.roll) { const id = curItem(); rolls[id + d.roll] = rollFor(id, d.roll); render(); return; }
  const id = curItem(), s = curStage();
  if (d.edmove) { const [si, ci, dir] = d.edmove.split(':').map(Number); const arr = E[si].c; const j = ci + dir; if (j >= 0 && j < arr.length) { [arr[ci], arr[j]] = [arr[j], arr[ci]]; } render(); return; }
  if (d.eddel) { const [si, ci] = d.eddel.split(':').map(Number); E[si].c.splice(ci, 1); if (!E[si].c.length) E[si].c.push({id: newId(), cue: '', text: ''}); render(); return; }
  if (d.edadd != null && d.edadd !== '') { E[+d.edadd].c.push({id: newId(), cue: '', text: ''}); render(); const si = +d.edadd; document.getElementById('ed-c-' + si + '-' + (E[si].c.length - 1))?.focus(); return; }
  if (d.eddelsec != null && d.eddelsec !== '') { E.splice(+d.eddelsec, 1); render(); return; }
  switch (d.act) {
    case 'edOpen': Eopen = true; E = null; EreplaceArmed = false; render(); break;
    case 'edCancel': Eopen = false; E = null; render(); break;
    case 'edRestore': delete S.custom[id]; buildItems(); E = null; save(); render(); break;
    case 'edStarter': {
      const hasText = E && E.some(sec => sec.c.some(c => c.text.trim()));
      if (hasText && !EreplaceArmed) { EreplaceArmed = true; render(); break; }
      E = [{g: 'Script', c: STARTERS[id].map(c => ({id: newId(), cue: c[0], text: c[1]}))}]; EreplaceArmed = false; render(); break;
    }
    case 'edSplit': { const parts = splitScript(Epaste); if (parts.length) { E = [{g: 'Script', c: parts}]; Epaste = ''; } render(); break; }
    case 'edAddSec': E.push({g: 'New section', c: [{id: newId(), cue: '', text: ''}]}); render(); break;
    case 'edSave': editorSave(id); render(); window.scrollTo(0, 0); break;
    case 'dReveal': D.revealed = true; render(); break;
    case 'dCheck': { const ta = document.getElementById('dAttempt'); if (!ta) break; const items = drillItems(drillOwner); const vis = drillVisible(items); D.typed = diff(items[vis[D.idx]].text, ta.value); render(); break; }
    case 'dAgainMark': drillMark('again'); break;
    case 'dGot': drillMark('got'); break;
    case 'dPrev': D.idx = Math.max(0, D.idx - 1); D.revealed = false; D.typed = null; render(); break;
    case 'dNext': D.idx++; D.revealed = false; D.typed = null; render(); break;
    case 'doneStage': if (exitMet(id, s) && (s === 0 || isDone(id, s - 1))) { S.done[id + ':' + s] = true; touch(id); if (s + 1 < stagesFor(id).length) S.ui.stage[id] = s + 1; save(); render(); window.scrollTo(0, 0); } break;
    case 'undoStage': delete S.done[id + ':' + s]; save(); render(); break;
    case 'toggleCard': ui4.hide = !ui4.hide; render(); break;
    case 'toggleText': ui4.text = !ui4.text; render(); break;
    case 'toggleRevDrill': showReviewDrill = !showReviewDrill; render(); break;
    case 'logDel': (S.deliveries[id] = S.deliveries[id] || []).push({d: today(), ok: d.ok === '1'}); touch(id); save(); render(); break;
    case 'logRev': (S.reviews[id] = S.reviews[id] || []).push({d: today(), ok: d.ok === '1'}); touch(id); save(); render(); break;
    case 'rollTopic': { const used = new Set((S.fills[id] || []).map(x => x.topic)); const fresh = TOPICS[id].filter(t => !used.has(t)); rolls[id + 'topic'] = rand(fresh.length ? fresh : TOPICS[id]); render(); break; }
    case 'logFill': { const t = rolls[id + 'topic']; if (t) { (S.fills[id] = S.fills[id] || []).push({topic: t, d: today()}); delete rolls[id + 'topic']; touch(id); save(); render(); } break; }
    case 'newMock': newMock(); break;
    case 'interrupt': doInterrupt(); break;
    case 'logMock': if (M.prompt) { S.mocks.push({n: M.prompt.n, d: today(), ok: M.checks.every(Boolean)}); save(); clearTimeout(M.timer); M.prompt = null; M.interrupt = null; render(); } break;
  }
});
document.addEventListener('change', e => {
  const t = e.target, d = t.dataset;
  if (d.check) { S.checks[d.check] = t.checked; save(); render(); return; }
  if (d.var) { const id = curItem(); (S.vars[id] = S.vars[id] || {})[d.var] = t.checked; touch(id); save(); render(); return; }
  if (d.mcheck != null) { M.checks[+d.mcheck] = t.checked; return; }
  if (t.id === 'dGroup') { D.group = t.value; D.idx = 0; D.revealed = false; D.typed = null; render(); return; }
  if (t.id === 'dAgain') { D.againOnly = t.checked; D.idx = 0; D.revealed = false; D.typed = null; render(); return; }
  if (t.id === 'mAuto') { M.auto = t.checked; if (!M.auto) clearTimeout(M.timer); return; }
});
document.addEventListener('input', e => {
  const t = e.target, d = t.dataset;
  if (d.edg != null && d.edg !== '' && E) { E[+d.edg].g = t.value; return; }
  if (d.edc && E) { const [si, ci] = d.edc.split(':').map(Number); E[si].c[ci].cue = t.value; return; }
  if (d.edt && E) { const [si, ci] = d.edt.split(':').map(Number); E[si].c[ci].text = t.value; return; }
  if (t.id === 'edPaste') { Epaste = t.value; return; }
  if (d.beat) { (S.beats[d.beat] = S.beats[d.beat] || {}).beat = t.value; save(); }
  if (d.key) { (S.beats[d.key] = S.beats[d.key] || {}).key = t.value; save(); }
});
document.addEventListener('keydown', e => {
  if (!drillOwner) return;
  const tag = e.target.tagName;
  if (tag === 'TEXTAREA') { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); document.querySelector('[data-act="dCheck"]')?.click(); } return; }
  if (tag === 'INPUT' || tag === 'SELECT') return;
  const graded = D.mode === 'type' ? !!D.typed : D.revealed;
  if (e.key === ' ' && D.mode !== 'type' && !D.revealed && document.querySelector('[data-act="dReveal"]')) { e.preventDefault(); D.revealed = true; render(); }
  else if (e.key === '1' && graded) drillMark('again');
  else if (e.key === '2' && graded) drillMark('got');
});

render();

</script>
