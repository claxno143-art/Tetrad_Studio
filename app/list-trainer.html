* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; }

p { margin: 0; }

.stack .m { background: var(--good); } .stack .l { background: var(--mid); }
.wrap { max-width: 860px; margin: 0 auto; padding-block: 20px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }

.muted { color: var(--muted); }

.deck:hover { border-color: var(--accent); }

.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.between { justify-content: space-between; }

.list { display: flex; flex-direction: column; }

.st.l { border-color: var(--mid); color: var(--mid); background: var(--mid-soft); }

.danger { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }

.li .tag { margin-left: 6px; }

      const base = d.key + '|' + it[0] + (d.key === 'rootlist' ? '|' + it[1] : '');

  const r = S.cards[id] || {b: 0, d: 0};
  if (g === 'again') r.b = 1; else if (g === 'good') r.b = Math.min(INTERVAL.length - 1, Math.max(1, r.b + 1)); else r.b = Math.min(INTERVAL.length - 1, Math.max(2, r.b + 2));
  r.d = dayNum() + (g === 'again' ? 1 : INTERVAL[r.b]);

}

      prev.map(r => '<tr>' + Array.from({length: n}, (_, c) => '<td class="' + role(c) + '">' + esc(short(r[c] || '', 60)) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>' +
      '<p class="muted">' + v.ok.length + ' row' + (v.ok.length === 1 ? '' : 's') + ' ready to import' + (v.skipped ? ', ' + v.skipped + ' skipped because the Russian or the English is missing' : '') + '. Showing the first ' + prev.length + '.</p></div>' +
      '<div class="card"><h2>Where should they go?</h2><div class="controls"><label class="field">Add to<select id="impTarget"><option value="new"' + (IMP.target === 'new' ? ' selected' : '') + '>A new set</option>' + mine.map(d => '<option value="' + d.key + '"' + (IMP.target === d.key ? ' selected' : '') + '>' + esc(d.name) + ' (' + d.items.length + ')</option>').join('') + '</select></label>' +
      (IMP.target === 'new' ? '<label class="field" style="flex:1;min-width:220px">Name of the new set<input type="text" id="impName" value="' + esc(IMP.setName) + '"></label>' : '') + '</div>' +
      '<div class="row"><button type="button" class="btn primary" data-act="impGo"' + (v.ok.length ? '' : ' disabled') + '>Import ' + v.ok.length + ' item' + (v.ok.length === 1 ? '' : 's') + '</button><span class="muted">Words already in the set are skipped.</span></div></div>';
  }
  return h;
}
const keyOf = (ru, en) => ru.toLowerCase().replace(/ё/g, 'е').trim() + '\u0001' + en.toLowerCase().trim();
function addItems(d, list) {
  const seen = new Set(d.items.map(it => keyOf(it[0], it[1]))); let added = 0, dup = 0;
  list.forEach(r => { const k = keyOf(r.ru, r.en); if (seen.has(k)) { dup++; return; } seen.add(k); d.items.push([r.ru, r.en, r.tag || '', newUid()]); added++; });
  return {added, dup};
}
function newSet(name) { const d = {key: 'u_' + newUid(), name: name || 'New set', desc: '', items: [], custom: true}; DECKS.push(d); refreshDeck(d); return d; }
function doImport() {
  const v = importable(); if (!v.ok.length) return;
  const d = IMP.target === 'new' ? newSet((IMP.setName || '').trim() || 'Imported set') : deckOf(IMP.target);
  const r = addItems(d, v.ok); refreshDeck(d);
  FLASH = 'Added ' + r.added + ' item' + (r.added === 1 ? '' : 's') + ' to ' + d.name + (r.dup ? ', skipped ' + r.dup + ' already in the set' : '') + (v.skipped ? ', ' + v.skipped + ' rows had no Russian or no English' : '') + '.';
  SCREEN = null; IMP = null; S.ui.deck = d.key; S.ui.mode = 'browse'; S.ui.tag = ''; browseQ = ''; resetModes(); save();
}

// ---------- my sets: editing ----------
let EDITUID = null, DELSET = false;
function viewEdit(d) {
  let h = '<div class="card"><h3>Set details</h3><div class="sgrid"><label class="field">Name<input type="text" id="eName" value="' + esc(d.name) + '"></label><label class="field">Description (optional)<input type="text" id="eDesc" value="' + esc(d.desc || '') + '"></label></div><div class="row"><button type="button" class="btn small" data-act="eInfo">Save details</button></div></div>' +
    '<div class="card"><h3>Add a word</h3><form id="addForm" class="addgrid" autocomplete="off"><label class="field">Russian<input type="text" id="aRu" lang="ru" spellcheck="false"></label><label class="field">English<input type="text" id="aEn"></label><label class="field">Tags (optional)<input type="text" id="aTag" placeholder="e.g. Food, Verbs"></label><button type="submit" class="btn primary">Add</button></form>' +
    '<div class="row"><button type="button" class="btn small" data-act="openImport" data-into="' + d.key + '">Import more from a file</button><span class="muted" style="font-size:.85rem">Press Enter in any box to add. Separate several tags with commas.</span></div></div>' +
    '<div class="card"><h3>Words in this set (' + d.items.length + ')</h3>';
  if (!d.items.length) h += '<p class="muted">Nothing here yet. Add a word above or import a file.</p>';
  else h += '<div class="list">' + d.items.slice().reverse().map(it => {
    const u = it[3];
    if (EDITUID === u) return '<div class="li editrow"><input type="text" id="xRu" lang="ru" value="' + esc(it[0]) + '" aria-label="Russian"><input type="text" id="xEn" value="' + esc(it[1]) + '" aria-label="English"><input type="text" id="xTag" value="' + esc(it[2] || '') + '" placeholder="Tags" aria-label="Tags"><span class="row"><button type="button" class="btn small primary" data-esave="' + u + '">Save</button><button type="button" class="btn small" data-act="eCancel">Cancel</button></span></div>';
    return '<div class="li"><span class="r">' + esc(it[0]) + '</span><span class="e">' + esc(it[1]) + (it[2] ? ' <span class="tag">' + esc(it[2]) + '</span>' : '') + '</span><span class="row" style="flex-wrap:nowrap"><button type="button" class="btn small" data-eedit="' + u + '">Edit</button><button type="button" class="btn small" data-edel="' + u + '" aria-label="Delete">✕</button></span></div>';
  }).join('') + '</div>';
  h += '</div><div class="card"><div class="danger" style="border:0;padding:0"><span class="label">Delete this set</span><p class="muted" style="font-size:.85rem">Removes the set, its words and your progress on them. This can’t be undone.</p><div class="row"><button type="button" class="btn warn' + (DELSET ? ' armed' : '') + '" data-act="eDelSet">' + (DELSET ? 'Tap again to delete ' + esc(d.name) : 'Delete ' + esc(d.name)) + '</button></div></div></div>';
  return h;
}
function deleteSet(d) {
  d.cards.forEach(c => { delete S.cards[c.id]; delete CARDS[c.id]; });
  DECKS.splice(DECKS.indexOf(d), 1); indexAll(); saveCustom();
  S.ui.deck = null; save(); resetModes();
}
function customClick(b, d) {
  const deck = S.ui.deck ? deckOf(S.ui.deck) : null;
  if (d.act !== 'eDelSet') DELSET = false;
  if (d.eedit) { EDITUID = d.eedit; render(); document.getElementById('xRu')?.focus(); return true; }
  if (d.esave) {
    const it = deck.items.find(x => x[3] === d.esave), ru = document.getElementById('xRu').value.trim(), en = document.getElementById('xEn').value.trim();
    if (it && ru && en) { it[0] = ru; it[1] = en; it[2] = document.getElementById('xTag').value.trim(); refreshDeck(deck); }
    EDITUID = null; render(); return true;
  }
  if (d.edel) { deck.items = deck.items.filter(x => x[3] !== d.edel); delete S.cards[deck.key + '|' + d.edel]; save(); refreshDeck(deck); resetModes(); render(); return true; }
  switch (d.act) {
    case 'newSet': { const s = newSet('New set'); S.ui.deck = s.key; S.ui.mode = 'edit'; S.ui.tag = ''; resetModes(); save(); render(); window.scrollTo(0, 0); document.getElementById('eName')?.select(); return true; }
    case 'openImport': openImport(d.into); render(); window.scrollTo(0, 0); return true;
    case 'impBack': SCREEN = null; IMP = null; render(); return true;
    case 'impPaste': usePaste(); return true;
    case 'impSwap': [IMP.ru, IMP.en] = [IMP.en, IMP.ru]; render(); return true;
    case 'impGo': doImport(); render(); window.scrollTo(0, 0); return true;
    case 'eInfo': deck.name = document.getElementById('eName').value.trim() || deck.name; deck.desc = document.getElementById('eDesc').value.trim(); saveCustom(); FLASH = 'Saved.'; render(); return true;
    case 'eCancel': EDITUID = null; render(); return true;
    case 'eDelSet': if (DELSET) { DELSET = false; deleteSet(deck); } else DELSET = true; render(); return true;
  }
  return false;
}
function customChange(t) {
  if (t.id === 'impFile') { if (t.files && t.files[0]) loadFile(t.files[0]); return true; }
  if (!IMP) return false;
  if (t.id === 'impSheet') { IMP.sheet = t.value; applySheet(); render(); return true; }
  if (t.id === 'impRu') { IMP.ru = +t.value; render(); return true; }
  if (t.id === 'impEn') { IMP.en = +t.value; render(); return true; }
  if (t.id === 'impTag') { IMP.tag = +t.value; render(); return true; }
  if (t.id === 'impHead') { IMP.header = t.checked; render(); return true; }
  if (t.id === 'impTarget') { IMP.setName = IMP.setName || (IMP.fileName || '').replace(/\.[^.]+$/, ''); IMP.target = t.value; render(); return true; }
  return false;
}
document.addEventListener('input', e => { if (e.target.id === 'impName' && IMP) IMP.setName = e.target.value; });
document.addEventListener('submit', e => {
  if (e.target.id !== 'addForm') return;
  e.preventDefault();
  const deck = deckOf(S.ui.deck), ru = document.getElementById('aRu').value.trim(), en = document.getElementById('aEn').value.trim(), tag = document.getElementById('aTag').value.trim();
  if (!ru || !en) { document.getElementById(ru ? 'aEn' : 'aRu').focus(); return; }
  const r = addItems(deck, [{ru, en, tag}]); refreshDeck(deck); resetModes();
  FLASH = r.added ? 'Added ' + ru + '.' : ru + ' is already in this set.';
  render(); const f = document.getElementById('aRu'); if (f) f.focus();
  const tg = document.getElementById('aTag'); if (tg) tg.value = tag; // keep the tag for the next word
});
// Dropping a file anywhere opens the import screen with it (and stops the window navigating to the file).
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (!f) return;
  if (SCREEN !== 'import') { const d = S.ui.deck && deckOf(S.ui.deck); openImport(d && d.custom ? d.key : 'new'); }
  loadFile(f);
});

// ---------- render & events ----------
function render() {
  if (S.ui.deck && !deckOf(S.ui.deck)) S.ui.deck = null;
  topbar();
  const flash = FLASH ? '<div class="result good"><p>' + esc(FLASH) + '</p></div>' : ''; FLASH = '';
  document.getElementById('app').innerHTML = (SETOPEN ? settingsHTML() : '') + flash + (SCREEN === 'import' ? viewImport() : S.ui.deck ? viewDeck() : viewHome());
  document.getElementById('gear').setAttribute('aria-expanded', SETOPEN);
  const t = document.getElementById('tIn'); if (t) t.focus({preventScroll: true});
}
function resetModes() { SESSION = null; QUIZ = null; TYPE = null; FIND = null; BUILD = null; revealed = false; browseN = 100; }
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset, deck = S.ui.deck ? deckOf(S.ui.deck) : null;
  if (customClick(b, d)) return;
  if ('home' in d || d.open) { SCREEN = null; IMP = null; EDITUID = null; }
  if ('home' in d) { S.ui.deck = null; save(); resetModes(); render(); window.scrollTo(0, 0); return; }
  if (d.open) { S.ui.deck = d.open; S.ui.tag = ''; S.ui.tier = ''; S.ui.mode = 'study'; browseQ = ''; save(); resetModes(); render(); window.scrollTo(0, 0); return; }
  if (d.mode) { S.ui.mode = d.mode; save(); if (d.mode === 'quiz') QUIZ = null; render(); return; }
  if (d.g) { doGrade(d.g); return; }
  if (d.opt != null) { pickOpt(+d.opt); return; }
  if (d.lt != null) { const k = +d.lt, i = FIND.sel.indexOf(k); if (i >= 0) FIND.sel.splice(i, 1); else FIND.sel.push(k); render(); return; }
  if (d.pick != null) { BUILD.picked.push(+d.pick); render(); return; }
  if (d.unpick != null) { BUILD.picked.splice(+d.unpick, 1); render(); return; }
  if (d.mark) { const id = d.mark, s = status(id); if (s === 'm') delete S.cards[id]; else S.cards[id] = {b: MASTER, d: dayNum() + INTERVAL[MASTER]}; save(); render(); return; }
  if (d.act !== 'resetDeck' && d.act !== 'resetAll') ARMED = '';
  switch (d.act) {
    case 'settings': SETOPEN = !SETOPEN; render(); if (SETOPEN) window.scrollTo(0, 0); break;
    case 'openReset': SETOPEN = true; ARMED = 'deck'; render(); window.scrollTo(0, 0); break;
    case 'resetDeck': if (ARMED === 'deck') { resetDeck(S.ui.deck); ARMED = ''; SETOPEN = false; } else ARMED = 'deck'; render(); break;
    case 'resetAll': if (ARMED === 'all') { S.cards = {}; save(); resetModes(); ARMED = ''; SETOPEN = false; } else ARMED = 'all'; render(); break;
    case 'start': case 'again-session': startSession(deck, filtered(deck)); render(); break;
    case 'reveal': revealed = true; render(); break;
    case 'end': SESSION.q = []; render(); break;
    case 'quiz': newQuiz(deck, filtered(deck)); render(); break;
    case 'next': QUIZ.i++; render(); break;
    case 'type': newType(deck, filtered(deck)); render(); break;
    case 'tcheck': typeCheck(false); break;
    case 'tskip': typeCheck(true); break;
    case 'tnext': TYPE.i++; TYPE.res = null; render(); break;
    case 'more': browseN += 200; render(); break;
    case 'find': newFind(deck, filtered(deck)); render(); break;
    case 'fcheck': findCheck(); break;
    case 'fhint': FIND.hint = true; render(); break;
    case 'fclear': FIND.sel = []; render(); break;
    case 'fnext': FIND.i++; FIND.sel = []; FIND.checked = null; FIND.hint = false; render(); break;
    case 'build': newBuild(deck, filtered(deck)); render(); break;
    case 'bcheck': buildCheck(); break;
    case 'bhint': BUILD.hint = true; render(); break;
    case 'bclear': BUILD.picked = []; render(); break;
    case 'bnext': BUILD.i++; BUILD.picked = []; BUILD.checked = null; BUILD.hint = false; render(); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (customChange(t)) return;
  if (t.id === 'fTag') { S.ui.tag = t.value; resetModes(); save(); render(); }
  if (t.id === 'fTier') { S.ui.tier = t.value; resetModes(); save(); render(); }
  if (t.id === 'fDir') { S.ui.dir = t.value; SESSION = null; QUIZ = null; save(); render(); }
  if (t.name === 'pool') { S.ui.pool = t.value; resetModes(); save(); render(); }
  if (t.id === 'sNew') { S.ui.newPer = +t.value; SESSION = null; save(); render(); }
  if (t.id === 'sMax') { S.ui.maxPer = +t.value; SESSION = null; save(); render(); }
  if (t.id === 'sRound') { S.ui.round = +t.value; QUIZ = null; TYPE = null; FIND = null; BUILD = null; save(); render(); }
  if (t.id === 'sOrder') { S.ui.order = t.value; resetModes(); save(); render(); }
  if (t.id === 'sDir') { S.ui.dir = t.value; SESSION = null; QUIZ = null; save(); render(); }
});
let bt = null;
document.addEventListener('input', e => {
  if (e.target.id === 'bQ') { browseQ = e.target.value; browseN = 100; clearTimeout(bt); bt = setTimeout(() => { const pos = e.target.selectionStart; render(); const el = document.getElementById('bQ'); if (el) { el.focus(); el.setSelectionRange(pos, pos); } }, 200); }
});
document.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (tag === 'TEXTAREA') { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && TYPE && !TYPE.res) { e.preventDefault(); typeCheck(false); } return; }
  if (tag === 'INPUT' || tag === 'SELECT') return;
  if (!S.ui.deck) return;
  if (S.ui.mode === 'study' && SESSION && SESSION.q.length) {
    if (e.key === ' ' && !revealed) { e.preventDefault(); revealed = true; render(); }
    else if (revealed && e.key === '1') doGrade('again');
    else if (revealed && e.key === '2') doGrade('good');
    else if (revealed && e.key === '3') doGrade('easy');
  } else if (S.ui.mode === 'find' && FIND && FIND.checked && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); document.querySelector('[data-act="fnext"]')?.click();
  } else if (S.ui.mode === 'build' && BUILD && BUILD.checked && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); document.querySelector('[data-act="bnext"]')?.click();
  } else if (S.ui.mode === 'quiz' && QUIZ && QUIZ.i < QUIZ.qs.length) {
    const q = QUIZ.qs[QUIZ.i];
    if (!q.pick && ['1', '2', '3', '4'].includes(e.key) && +e.key <= q.opts.length) pickOpt(+e.key - 1);
    else if (q.pick && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); QUIZ.i++; render(); }
  }
});
render();
</script>

</body></html>
